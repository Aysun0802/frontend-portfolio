<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

    <title>Profile Card</title>
</head>

<body>
    <div class="card">
        <div class="red-circle"></div>
        <img
            src="https://i.pravatar.cc/300"
            alt="Profile Photo"
            class="profile-image"
        >

        <h2 class="name">Aysun Sariyeva</h2>
        <p class="info">Computer Engineering Student</p>
        <p class="info">Azerbaijan State Oil and Industry University</p>
        <div class="orange-box"></div>

    </div>
    <button class="fixed-button">
        Contact
    </button>

</body>
</html>
